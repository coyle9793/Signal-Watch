    <div class="mm-rules"><span>Session: <b>${L.dur}s</b></span><span>Max spread: <b>${px(L.oblig)}</b></span><span>Inventory limit: <b>±${LIMIT.toLocaleString("en-GB")}</b></span><span>Hedging: <b>${L.hedge?"index futures":"none"}</b></span><span>Targets: <b>${L.goals.map(money).join(" / ")}</b></span></div>
    <p class="mm-keys">Keyboard: <kbd>←</kbd><kbd>→</kbd> move quotes £0.05 (hold <kbd>Shift</kbd> for £0.25) · <kbd>↑</kbd><kbd>↓</kbd> widen or narrow the spread · <kbd>P</kbd> pause</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn" data-start>Start trading</button><button class="btn ghost" data-levels>All levels</button></div></div>${notes()}`;
}
function start(){
  view="desk";
  g={t:0,M:100,I:0,cOff:0,mid:100,spread:.40,pulled:false,inv:0,cash:0,h:0,hCash:0,hCost:0,fills:[],tape:[],hist:[],news:[],obTicks:0,ticks:0,paused:false,crash:null,rejected:0,
    events:L.events.map(e=>{const dir=e.kind==="crash"?-1:(Math.random()<.5?1:-1);
      return {...e,dir,done:false,head:e.kind==="crash"?HEAD.crash:pick(HEAD[(e.kind==="co"?"co":"mk")+(dir>0?"Up":"Dn")])}})};
  root.innerHTML=`<div class="mm-desk">
    <section class="mm-main">
      <div class="mm-top"><span class="mm-lvsub">${L.name}</span><span class="mm-clock" id="mmClock">0s / ${L.dur}s</span><button class="btn ghost" data-pause id="mmPause">Pause</button></div>
      <div class="mm-news" id="mmNews" aria-live="assertive">Market open. Set your quotes.</div>
      <div class="mm-chartwrap"><canvas id="mmChart" aria-label="Chart of your quotes and trades"></canvas></div>
      <div class="mm-quote">
        <div class="mm-q bid"><span>Your bid</span><b id="mmBid"></b><small>You buy here</small></div>
        <div class="mm-q mid"><span>Spread</span><b id="mmSpr"></b><label for="mmSpread" class="cs-sr">Spread width</label><input type="range" id="mmSpread" min="0.02" max="2" step="0.02" value="0.40"><small id="mmObl">Max allowed ${px(L.oblig)}</small></div>
        <div class="mm-q ask"><span>Your ask</span><b id="mmAsk"></b><small>You sell here</small></div>
      </div>
      <div class="mm-ctrls"><span>Move quotes</span>
        <button data-shift="-0.25">−0.25</button><button data-shift="-0.05">−0.05</button><button data-shift="0.05">+0.05</button><button data-shift="0.25">+0.25</button>
        <button class="mm-pull" data-pull id="mmPull" aria-pressed="false">Pull quotes</button></div>
    </section>
    <aside class="mm-side">
      <div class="mm-box"><div class="mm-stat"><span>Live P&amp;L <i title="Marked at your mid price">(at your mid)</i></span><b id="mmPnl">£0</b></div>
        <div class="mm-stat sm"><span>Cash</span><b id="mmCash">£0</b></div>
        <div class="mm-gauge"><div class="mm-glab"><span>Inventory</span><b id="mmInv">0</b></div><div class="mm-gtrack"><i id="mmInvBar"></i></div><div class="mm-glab sm"><span>−${LIMIT/1000}k</span><span>0</span><span>+${LIMIT/1000}k</span></div></div>
        <div class="mm-gauge"><div class="mm-glab"><span>Obligation uptime</span><b id="mmUp">100%</b></div><div class="mm-gtrack up"><i id="mmUpBar"></i></div><div class="mm-glab sm"><span></span><span>needs 80%</span></div></div>
      </div>
      ${L.hedge?`<div class="mm-box"><div class="mm-stat sm"><span>Index future</span><b id="mmFut">100.00</b></div><div class="mm-stat sm"><span>Futures position</span><b id="mmH">0</b></div>
        <div class="mm-hbtns"><button data-hedge="-500">Sell 500</button><button data-hedge="500">Buy 500</button><button data-hedge="flat">Flatten</button></div><small class="mm-hnote">Costs £0.01 per share-equivalent. Tracks the market, not the company.</small></div>`:""}
      <div class="mm-box"><span class="mm-tapeh">Order tape</span><ol class="mm-tape" id="mmTape"><li class="muted">Waiting for orders…</li></ol></div>
    </aside></div>`;
  updateDesk();
  timer=setInterval(tick,TICK*1000);
}
function stop(){clearInterval(timer);timer=null}

/* ---------- simulation ---------- */
function makeOrder(V,Vinfo,bid,ask,lead){
  const informed=Math.random()<(lead?.30:L.pi);
  if(informed){
    if(Vinfo>ask+.01)return {type:"informed",side:"buy",size:200+100*Math.floor(Math.random()*4)};
    if(Vinfo<bid-.01)return {type:"informed",side:"sell",size:200+100*Math.floor(Math.random()*4)};
    return null;
  }
  if(Math.random()>Math.exp(-(g.spread/2)/.30))return null; // noise traders shy away from wide spreads
  const panic=g.crash&&g.t-g.crash.t0<20; // ordinary investors panic-sell during the crash
  return {type:"noise",side:Math.random()<(panic?.3:.5)?"buy":"sell",size:100+100*Math.floor(Math.random()*3)};
}
function fill(o,bid,ask,V){
  if(!o||g.pulled)return;
  if(o.side==="buy"){ // they buy at your ask: you sell
    if(g.inv-o.size<-LIMIT){g.rejected++;return}
    g.inv-=o.size;g.cash+=ask*o.size;g.fills.push({t:g.t,s:-1,q:o.size,p:ask,V,type:o.type});
  }else{
    if(g.inv+o.size>LIMIT){g.rejected++;return}
    g.inv+=o.size;g.cash-=bid*o.size;g.fills.push({t:g.t,s:1,q:o.size,p:bid,V,type:o.type});
  }
  g.tape.unshift({t:g.t,side:o.side,q:o.size,p:o.side==="buy"?ask:bid});
  if(g.tape.length>9)g.tape.pop();
}
function step(){
  g.t=+(g.t+TICK).toFixed(2);g.ticks++;
  g.M+=randn()*L.sigM;g.I+=randn()*L.sigI;
  for(const e of g.events)if(!e.done&&g.t>=e.t){
    e.done=true;g.news.push({t:g.t,head:e.head,dir:e.dir});
    if(e.kind==="co")g.I+=e.dir*e.size;else if(e.kind==="mkt")g.M+=e.dir*e.size;else g.crash={t0:g.t,size:e.size};
  }
  if(g.crash){const dt=g.t-g.crash.t0,s=g.crash.size;
    g.cOff=dt<=12?-s*dt/12:dt<=32?-s+(s-1)*(dt-12)/20:-1;}
  const {bid,ask}=quotes(),V=val();
  if(!g.pulled&&g.spread<=L.oblig+1e-9)g.obTicks++;
  const up=g.events.find(e=>!e.done&&e.kind==="co"&&e.t-g.t<=L.lead);
  const Vinfo=V+(up?up.dir*up.size:0);
  const orders=[];
  if(Math.random()<L.lam*TICK)orders.push(makeOrder(V,Vinfo,bid,ask,!!up));
  if(!g.pulled&&(V>ask+.05||V<bid-.05)&&Math.random()<.5)orders.push({type:"informed",side:V>ask?"buy":"sell",size:300+100*Math.floor(Math.random()*4)}); // fast traders snipe stale quotes
  if(g.crash&&g.t-g.crash.t0<12&&Math.random()<.7)orders.push({type:"algo",side:"sell",size:600+100*Math.floor(Math.random()*7)}); // the sell program ignores price
  orders.forEach(o=>fill(o,bid,ask,V));
  g.hist.push({t:g.t,bid,ask,V,F:fut(),pulled:g.pulled});
}
function tick(){
  if(!g||g.paused)return;
  step();
  if(g.t>=L.dur-1e-9){stop();debrief()}else updateDesk();
}
function hedge(cmd){
  const F=fut();let q=cmd==="flat"?-g.h:+cmd;if(!q)return;
  g.h+=q;g.hCash-=q*F;g.hCost+=Math.abs(q)*HCOST;updateDesk();
}
function results(){
  // realised-spread decomposition: spread captured at the trade, price impact over the next 8 seconds, then inventory drift
  const Vend=val(),Fend=fut(),Vat=t=>{const i=Math.min(g.hist.length-1,Math.max(0,Math.round(t/TICK)-1));return g.hist[i].V};
  let spread=0,adverse=0,invP=0,infTot=0,algoTot=0;
  for(const f of g.fills){const v8=Vat(f.t+8),a=f.s*f.q*(f.V-f.p),b=f.s*f.q*(v8-f.V);spread+=a;adverse+=b;invP+=f.s*f.q*(Vend-v8);
    if(f.type==="informed")infTot+=a+b;else if(f.type==="algo")algoTot+=a+b}
  const hedgeP=g.hCash+g.h*Fend, liq=Math.abs(g.inv)*LIQ, uptime=g.ticks?g.obTicks/g.ticks:1, obPen=uptime<.8?OBPEN:0;
  const total=spread+adverse+invP+hedgeP-g.hCost-liq-obPen;
  return {Vend,spread,adverse,invP,infTot,algoTot,hedgeP,hCost:g.hCost,liq,uptime,obPen,total,trades:g.fills.length,infN:g.fills.filter(f=>f.type==="informed").length};
}

/* ---------- desk rendering ---------- */
function updateDesk(){
  if(view!=="desk")return;
  const {bid,ask}=quotes(),$=id=>document.getElementById(id);
  $("mmClock").textContent=`${Math.floor(g.t)}s / ${L.dur}s`;
  $("mmBid").textContent=g.pulled?"—":px(bid);$("mmAsk").textContent=g.pulled?"—":px(ask);
  $("mmSpr").textContent=px(g.spread);
  const ob=$("mmObl");ob.textContent=g.spread>L.oblig+1e-9?`Too wide! Max ${px(L.oblig)}`:`Max allowed ${px(L.oblig)}`;ob.className=g.spread>L.oblig+1e-9?"warn":"";
  const pnl=g.cash+g.inv*g.mid+g.hCash+g.h*fut()-g.hCost;
  $("mmPnl").textContent=money(pnl);$("mmPnl").className=pnl>=0?"up":"down";
  $("mmCash").textContent=money(g.cash);
  $("mmInv").textContent=(g.inv>0?"+":"")+g.inv.toLocaleString("en-GB")+(Math.abs(g.inv)>=LIMIT?" (limit)":"");
  const ib=$("mmInvBar"),w=Math.min(50,Math.abs(g.inv)/LIMIT*50);ib.style.left=(g.inv>=0?50:50-w)+"%";ib.style.width=w+"%";ib.style.background=Math.abs(g.inv)>LIMIT*.6?"var(--bad)":Math.abs(g.inv)>LIMIT*.3?"var(--gold)":"var(--good)";
  const up=g.ticks?g.obTicks/g.ticks:1;$("mmUp").textContent=Math.round(up*100)+"%";const ub=$("mmUpBar");ub.style.width=up*100+"%";ub.style.background=up<.8?"var(--bad)":"var(--good)";
  if(L.hedge){$("mmFut").textContent=fut().toFixed(2);$("mmH").textContent=(g.h>0?"+":"")+g.h.toLocaleString("en-GB")}
  $("mmTape").innerHTML=g.tape.length?g.tape.map(o=>`<li class="${o.q>=600?"big":""}"><span>${o.t.toFixed(1)}s</span><b class="${o.side==="buy"?"up":"down"}">${o.side==="buy"?"BUY":"SELL"} ${o.q}</b><span>you ${o.side==="buy"?"sold":"bought"} @ ${o.p.toFixed(2)}</span></li>`).join(""):'<li class="muted">Waiting for orders…</li>';
  const last=g.news[g.news.length-1];
  if(last&&g.t-last.t<6){const n=$("mmNews");n.textContent=`${last.t.toFixed(0)}s · ${last.head}`;n.className="mm-news hot"}
  else{const n=$("mmNews");n.className="mm-news";n.textContent=g.paused?"Paused.":g.pulled?"Quotes pulled: you're not trading, and your obligation clock is running.":"Market open."}
  $("mmPull").setAttribute("aria-pressed",String(g.pulled));$("mmPull").textContent=g.pulled?"Resume quoting":"Pull quotes";
  $("mmPause").textContent=g.paused?"Resume":"Pause";
  if(document.activeElement!==$("mmSpread"))$("mmSpread").value=g.spread;
  drawChart($("mmChart"),false);
}
function drawChart(c,reveal){
  if(!c||!c.parentElement.clientWidth)return;
  const dpr=Math.min(devicePixelRatio||1,2),W=c.parentElement.clientWidth,H=c.parentElement.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const ctx=c.getContext("2d");ctx.scale(dpr,dpr);
  ctx.fillStyle="#0b1020";ctx.fillRect(0,0,W,H);
  const hs=g.hist,padL=46,padR=10,padT=12,padB=22;
  let lo=Infinity,hi=-Infinity;
  for(const h of hs){if(!h.pulled){lo=Math.min(lo,h.bid);hi=Math.max(hi,h.ask)}if(reveal){lo=Math.min(lo,h.V);hi=Math.max(hi,h.V)}}
  if(!isFinite(lo)){lo=g.mid-1;hi=g.mid+1}
  lo=Math.min(lo,g.mid-g.spread/2);hi=Math.max(hi,g.mid+g.spread/2);
  const m=Math.max(.4,(hi-lo)*.12);lo-=m;hi+=m;
  const X=t=>padL+(t/L.dur)*(W-padL-padR),Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);
  ctx.strokeStyle="rgba(154,166,191,.15)";ctx.fillStyle="#9aa6bf";ctx.font="11px JetBrains Mono, monospace";ctx.lineWidth=1;ctx.textAlign="right";ctx.textBaseline="middle";
  const stepv=(hi-lo)>6?2:(hi-lo)>3?1:.5;
  for(let v=Math.ceil(lo/stepv)*stepv;v<=hi;v+=stepv){ctx.beginPath();ctx.moveTo(padL,Y(v));ctx.lineTo(W-padR,Y(v));ctx.stroke();ctx.fillText(v.toFixed(stepv<1?1:0),padL-6,Y(v))}
  ctx.textAlign="center";ctx.textBaseline="top";
  for(let t=0;t<=L.dur;t+=15)ctx.fillText(t+"s",X(t),H-padB+6);
  // news markers
  g.news.forEach((n,i)=>{ctx.strokeStyle="rgba(242,195,107,.55)";ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(X(n.t),padT);ctx.lineTo(X(n.t),H-padB);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#f2c36b";ctx.beginPath();ctx.arc(X(n.t),padT+8,8,0,7);ctx.fill();ctx.fillStyle="#1a1405";ctx.textBaseline="middle";ctx.fillText(String(i+1),X(n.t),padT+8);ctx.textBaseline="top"});
  // quote band
  ctx.fillStyle="rgba(91,141,239,.16)";
  let open=false;ctx.beginPath();
  const segs=[];let cur=[];for(const h of hs){if(h.pulled){if(cur.length)segs.push(cur);cur=[]}else cur.push(h)}if(cur.length)segs.push(cur);
  for(const s of segs){ctx.beginPath();s.forEach((h,i)=>i?ctx.lineTo(X(h.t),Y(h.ask)):ctx.moveTo(X(h.t),Y(h.ask)));for(let i=s.length-1;i>=0;i--)ctx.lineTo(X(s[i].t),Y(s[i].bid));ctx.closePath();ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle="#67d29a";ctx.beginPath();s.forEach((h,i)=>i?ctx.lineTo(X(h.t),Y(h.bid)):ctx.moveTo(X(h.t),Y(h.bid)));ctx.stroke();
    ctx.strokeStyle="#f07470";ctx.beginPath();s.forEach((h,i)=>i?ctx.lineTo(X(h.t),Y(h.ask)):ctx.moveTo(X(h.t),Y(h.ask)));ctx.stroke();}
  if(reveal){ctx.strokeStyle="#f2c36b";ctx.lineWidth=2.2;ctx.beginPath();hs.forEach((h,i)=>i?ctx.lineTo(X(h.t),Y(h.V)):ctx.moveTo(X(h.t),Y(h.V)));ctx.stroke()}
  // fills
  for(const f of g.fills){const r=2.5+f.q/250;ctx.beginPath();ctx.arc(X(f.t),Y(f.p),r,0,7);
    ctx.fillStyle=f.s>0?"#67d29a":"#f07470";ctx.fill();
    if(reveal&&f.type!=="noise"){ctx.lineWidth=2;ctx.strokeStyle=f.type==="algo"?"#c98bff":"#ffffff";ctx.beginPath();ctx.arc(X(f.t),Y(f.p),r+3,0,7);ctx.stroke()}}
  if(!hs.length){ctx.fillStyle="#9aa6bf";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="14px Inter, sans-serif";ctx.fillText("Your bid (green) and ask (red) will trace here",W/2,H/2)}
}

/* ---------- debrief ---------- */
function debrief(){
  view="debrief";const r=results(),idx=LEVELS.indexOf(L);
  const st=r.total>=L.goals[2]?3:r.total>=L.goals[1]?2:r.total>=L.goals[0]?1:0;setBest(L.id,st);
  const row=(k,v,note)=>`<tr><td>${k}${note?`<small>${note}</small>`:""}</td><td class="${v>=0?"up":"down"}">${money(v)}</td></tr>`;
  root.innerHTML=`<div class="mm-debrief">
    <div class="mm-dhead"><div><p class="mm-lvsub">${L.sub} · session over</p><h2 class="ttl">${L.name}: ${money(r.total)}</h2></div><span class="mm-bigstars" aria-label="${st} of 3 stars">${stars(st)}</span></div>
    <div class="mm-chartwrap tall"><canvas id="mmChart2" aria-label="Chart of your quotes, trades and the hidden true value"></canvas></div>
    <p class="mm-legend"><span class="k gold"></span>True value (hidden during play) <span class="k band"></span>Your quotes <span class="k dotg"></span>You bought <span class="k dotr"></span>You sold <span class="k ring"></span>Informed trader${L.id==="flash"?' <span class="k ringp"></span>Sell program':""}</p>
    <div class="mm-dgrid">
      <div class="mm-box"><h3 class="mm-h">Where your P&amp;L came from</h3><table class="mm-break">
        ${row("Spread captured",r.spread,"Your trade price vs true value at the moment of each trade")}
        ${row("Adverse selection",r.adverse,`How far true value moved against you in the 8s after each trade. Informed traders (${r.infN} fills) cost you ${money(-r.infTot)} in total.`)}
        ${L.id==="flash"?`<tr><td colspan="2"><small>Trades with the sell program netted ${money(r.algoTot)} (included above).</small></td></tr>`:""}
        ${row("Inventory moves",r.invP,"Later changes in true value on the shares you held")}
        ${L.hedge?row("Hedging P&L",r.hedgeP,"Futures gains or losses")+row("Hedging costs",-r.hCost):""}
        ${row("Closing out your inventory",-r.liq,`£${LIQ.toFixed(2)} × ${Math.abs(g.inv).toLocaleString("en-GB")} shares left at the close`)}
        ${row("Obligation penalty",-r.obPen,`Uptime ${Math.round(r.uptime*100)}% (needs 80%)`)}
        <tr class="tot"><td>Total</td><td class="${r.total>=0?"up":"down"}">${money(r.total)}</td></tr></table>
        <p class="mm-small">${r.trades} trades · targets ${L.goals.map(money).join(" / ")} for 1–3 stars${g.rejected?` · ${g.rejected} orders refused at your inventory limit`:""}</p></div>
      <div class="mm-box"><h3 class="mm-h">What this level teaches</h3><ul class="mm-tips">${L.lessons.map(l=>`<li>${l}</li>`).join("")}</ul>
        ${g.news.length?`<h3 class="mm-h" style="margin-top:12px">Headlines</h3><ol class="mm-heads">${g.news.map(n=>`<li><b>${n.t.toFixed(0)}s</b> ${n.head}</li>`).join("")}</ol>`:""}
        ${L.reveal?`<h3 class="mm-h" style="margin-top:12px">The real event</h3><p class="mm-small" style="font-size:14px">${L.reveal}</p>`:""}</div>
    </div>
    <div class="actions" style="justify-content:flex-start"><button class="btn" data-retry>Try again</button>${idx<LEVELS.length-1?`<button class="btn ghost" data-lv="${idx+1}">Next level: ${LEVELS[idx+1].name}</button>`:""}<button class="btn ghost" data-levels>All levels</button></div>
    <p class="note">A teaching simulation: real markets have many competing market makers, queue priority, fees and much faster speeds.</p></div>`;
  requestAnimationFrame(()=>drawChart(document.getElementById("mmChart2"),true));
}

/* ---------- input ---------- */
root.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lv!==undefined)return brief(+b.dataset.lv);
  if("levels" in b.dataset)return levels();
  if("start" in b.dataset)return start();
  if("retry" in b.dataset)return brief(LEVELS.indexOf(L));
  if(view!=="desk")return;
  if(b.dataset.shift){g.mid=+(g.mid+ +b.dataset.shift).toFixed(2);updateDesk()}
  else if("pull" in b.dataset){g.pulled=!g.pulled;updateDesk()}
  else if("pause" in b.dataset){g.paused=!g.paused;updateDesk()}
  else if(b.dataset.hedge)hedge(b.dataset.hedge);
});
root.addEventListener("input",e=>{if(e.target.id==="mmSpread"&&g){g.spread=+(+e.target.value).toFixed(2);updateDesk()}});
document.addEventListener("keydown",e=>{
  if(view!=="desk"||document.getElementById("panel-mm").hidden)return;
  if(e.target.closest&&e.target.closest("input[type=text],input[type=search],textarea"))return;
  const k=e.key;let used=true;
  if(k==="ArrowLeft")g.mid=+(g.mid-(e.shiftKey?.25:.05)).toFixed(2);
  else if(k==="ArrowRight")g.mid=+(g.mid+(e.shiftKey?.25:.05)).toFixed(2);
  else if(k==="ArrowUp")g.spread=Math.min(2,+(g.spread+.02).toFixed(2));
  else if(k==="ArrowDown")g.spread=Math.max(.02,+(g.spread-.02).toFixed(2));
  else if(k==="p"||k==="P")g.paused=!g.paused;
  else used=false;
  if(used){e.preventDefault();updateDesk()}
});
const autoPause=()=>{if(view==="desk"&&g&&!g.paused&&(document.hidden||document.getElementById("panel-mm").hidden)){g.paused=true;updateDesk()}};
document.addEventListener("visibilitychange",autoPause);
document.addEventListener("tabchange",autoPause);
window.addEventListener("resize",()=>{if(view==="desk")updateDesk();else if(view==="debrief")drawChart(document.getElementById("mmChart2"),true)});
levels();
})();
(() => {
const tabs=[...document.querySelectorAll('.tab')];
function show(name){

}
tabs.forEach(t=>t.addEventListener('click',()=>{show(t.dataset.tab);if(location.hash!=='#'+t.dataset.tab)location.hash=t.dataset.tab}));

const h=location.hash.slice(1);show(h==='cases'||h==='mm'?h:'story');
})();
</script>
