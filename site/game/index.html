<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Episode: The Trade Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Alegreya+SC:wght@700&family=Special+Elite&display=swap">
<style>
/* Layout: one cinematic stage (story, map, terminal) with a status column beside it; the column folds above the stage on phones.
   A deliberate single dark look, like a late-night crisis room. */
:root{
  --bg:#0e1320; --panel:#161e31; --panel2:#1d2740; --line:#2a3653;
  --fg:#eef1f7; --muted:#9aa6bf; --gold:#f2c36b; --good:#67d29a; --bad:#f07470;
  --c1:#5b8def; --c2:#d0574f; --c3:#4caf7a; --c4:#e3b341; --c5:#c98b5a;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --ui:"Inter", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
.page{max-width:1240px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:900px){.page{grid-template-columns:minmax(0,1fr)}.hud{order:-1}}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/10;min-height:520px;max-width:100%;border-radius:14px;overflow:hidden;background:#0b1020;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.45)}
@media (max-width:600px){.stage{aspect-ratio:auto;height:640px}}
.bg{position:absolute;inset:0;transition:opacity .5s}
.bg-title{background:radial-gradient(120% 90% at 50% 110%,#2a3a6b 0%,#0e1320 60%)}
.bg-summit{background:
  linear-gradient(90deg,var(--c1) 0 20%,var(--c2) 20% 40%,var(--c3) 40% 60%,var(--c4) 60% 80%,var(--c5) 80%) top/100% 6px no-repeat,
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 90px),
  radial-gradient(90% 70% at 50% 0%,#33467e 0%,#151c33 55%,#0e1320 100%)}
.bg-alert{background:repeating-linear-gradient(135deg,rgba(240,116,112,.06) 0 18px,transparent 18px 36px),radial-gradient(90% 80% at 50% 20%,#5a1f2a 0%,#1c1222 60%,#0e1320 100%)}
.bg-floor{background:linear-gradient(rgba(103,210,154,.06) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(103,210,154,.06) 1px,transparent 1px) 0 0/32px 100%,radial-gradient(90% 80% at 50% 10%,#173a35 0%,#0f1a22 60%,#0e1320 100%)}
.bg-farm{background:repeating-linear-gradient(170deg,rgba(242,195,107,.10) 0 26px,rgba(103,210,154,.06) 26px 52px),radial-gradient(90% 70% at 50% 0%,#5a4a1e 0%,#22261a 55%,#0e1320 100%)}
.bg-storm{background:repeating-linear-gradient(105deg,rgba(180,210,255,.07) 0 2px,transparent 2px 22px),radial-gradient(80% 70% at 40% 10%,#3b4a66 0%,#161d2e 60%,#0b1020 100%)}
.bg-war{background:radial-gradient(circle at 70% 30%,rgba(242,195,107,.12) 0,transparent 40%),repeating-radial-gradient(circle at 70% 30%,rgba(255,255,255,.04) 0 1px,transparent 1px 40px),linear-gradient(160deg,#16263a,#0e1320)}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}
#mapCanvas.on{opacity:1}
.portrait{position:absolute;bottom:150px;width:min(240px,38%);aspect-ratio:1;transition:transform .35s ease,opacity .35s ease;opacity:0;pointer-events:none;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.portrait.left{left:4%}.portrait.right{right:4%}
.portrait.on{opacity:1}
@media (prefers-reduced-motion:no-preference){.portrait{transform:translateY(12px)}.portrait.on{transform:none}}
@media (max-width:600px){.portrait{bottom:200px;width:150px}}
.portrait.tall{aspect-ratio:300/620;width:min(185px,26%);bottom:140px}
@media (max-width:600px){.portrait.tall{width:112px;bottom:196px}}
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:6px 0 14px}
.leaders figure{margin:0;background:#f6f3ec;border-radius:12px;padding:10px 8px 8px;text-align:center;color:#1b1b1b}
.leaders svg{width:100%;max-width:120px;height:auto;display:block;margin:0 auto}
.leaders b{display:block;font-size:14px;margin-top:4px}
.leaders span{display:block;font-size:12px;font-weight:700}
.leaders small{display:block;font-size:12px;color:#555;margin-top:2px}

.dialog{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(14,19,32,.94);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;min-height:122px;backdrop-filter:blur(6px)}
.nameplate{position:absolute;top:-15px;left:16px;padding:4px 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.01em;color:#0e1320;background:var(--gold)}
.nameplate small{font-family:var(--ui);font-weight:600;opacity:.75;margin-left:6px;font-size:12px}
.line{margin:6px 0 0;font-size:17px;line-height:1.5;min-height:3em;max-width:70ch}
.line.narr{font-style:italic;color:#cfd6e6}
.next{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.next{animation:bob 1.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-3px)}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice:hover:not(:disabled){border-color:var(--gold);background:#24304d}
.choice small{font-family:var(--mono);font-weight:500;color:var(--gold);white-space:nowrap}
.prompt{font-family:var(--display);font-weight:800;font-size:18px;margin:0}

.news{position:absolute;left:0;right:0;top:12%;margin:auto;width:min(620px,92%);background:#f6f2ea;color:#1b1b1b;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.news .tag{background:var(--bad);color:#fff;font-weight:800;letter-spacing:.14em;font-size:12px;padding:6px 14px;display:flex;justify-content:space-between}
.news h3{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,28px);line-height:1.15;margin:12px 16px 6px;text-wrap:balance}
.news p{margin:0 16px 14px;color:#444}

.card{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(8,11,20,.72)}
.card>div{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-height:100%;overflow:auto}
.card .eyebrow{margin:0;color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.card h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.card p{margin:0 0 12px;color:#d6dcea}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:progress}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:6% 7%}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,78px);line-height:.95;margin:0;letter-spacing:-.02em}
.title h1 span{color:var(--gold)}
.title p{margin:0;max-width:52ch;color:#cdd5e6;font-size:16px}
.title label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.title input{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:min(260px,100%)}
.scenecard{text-align:center}
.scenecard .num{font-family:var(--mono);color:var(--gold);letter-spacing:.2em;font-size:13px}
.scenecard h2{font-size:40px}

.bopts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bopt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bopt b{display:block;font-size:15px}.bopt small{display:block;color:var(--muted);font-size:13px}
.bopt em{font-style:normal;font-family:var(--mono);color:var(--gold);white-space:nowrap}
.bopt[aria-pressed="true"]{border-color:var(--gold);background:#2a3352;box-shadow:inset 4px 0 0 var(--gold)}
.bopt:disabled{opacity:.45;cursor:not-allowed}
.bbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:14px;margin-bottom:12px}
.tbtns{display:flex;flex-wrap:wrap;gap:8px}
.tnote{font-size:13px!important;color:var(--muted)!important}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(14,19,32,.95);border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* ---------- trading terminal ---------- */
.term{position:absolute;inset:0;background:rgba(9,13,24,.97);display:flex;flex-direction:column;padding:16px 18px;gap:10px}
.term header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.term h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.term h2 span{font-family:var(--mono);font-size:12px;color:var(--good);letter-spacing:.12em;margin-left:8px;vertical-align:middle}
.term .sub{margin:0;color:var(--muted);font-size:14px}
.tablewrap{overflow:auto;flex:1;min-height:0;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;font-weight:700}
td{padding:8px 10px;border-top:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums}
td.name{font-family:var(--ui);font-weight:600}
td.name small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.up{color:var(--good)}.down{color:var(--bad)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-weight:700}
.qty button:hover:not(:disabled){border-color:var(--gold)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.term footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.term footer .fig{font-family:var(--mono);font-size:14px;color:var(--muted)}
.term footer .fig b{color:var(--fg)}
.hint{margin:0;font-size:13px;color:#cdd5e6;background:var(--panel);border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0}
.pl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px;min-width:0}
.pl td{font-family:var(--mono);padding:5px 0;border-top:1px solid var(--line)}
.pl td:last-child{text-align:right}

/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chap{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.2}
.chap small{display:block;font-family:var(--ui);font-weight:500;font-size:13px;color:var(--muted)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money div{min-width:0}
.money span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.money b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.money i{font-style:normal;font-family:var(--mono);font-size:12px}
.gauge{margin-top:10px}
.gauge .lab{display:flex;justify-content:space-between;font-size:13px}
.gauge .lab b{font-family:var(--mono)}
.track{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:99px;transition:width .5s}
.rel{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.rel .bar{position:relative;height:8px;background:var(--panel2);border-radius:99px}
.rel .bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5}
.rel .bar i{position:absolute;top:0;bottom:0;border-radius:99px;transition:all .5s}
.rel b{font-family:var(--mono);font-size:12px;text-align:right;min-width:3ch}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1;padding:8px 10px;font-size:14px}
.lessons{margin:0;padding-left:18px;color:#d6dcea;font-size:14px}
.lessons li{margin-bottom:6px}
.lessons b{color:var(--gold)}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 14px}
.report-grid div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.report-grid span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.report-grid b{font-family:var(--mono);font-size:18px}
.log{margin:0 0 12px;padding-left:18px;font-size:14px;color:#d6dcea}
.profile{background:linear-gradient(135deg,rgba(242,195,107,.16),rgba(242,195,107,.04));border:1px solid rgba(242,195,107,.4);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.profile b{font-family:var(--display);font-size:22px;color:var(--gold);display:block}
/* ---------- tabs ---------- */
.tabs{max-width:1240px;margin:0 auto;padding-block:14px 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.tabs .brand{font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto;padding-bottom:6px}
.tabs .brand span{color:var(--gold)}
.tab{background:transparent;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:9px 16px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 3px 0 var(--gold)}
.tab:hover{color:var(--fg)}
.tabline{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.tabline div{border-top:1px solid var(--line)}

/* ---------- case files ---------- */
.cf{max-width:1100px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px;--paper:#efe6d2;--paper2:#e6dbc2;--ink:#2a241c;--inkm:#6b5f4c;--stamp:#b3372f;--type:"Special Elite","Courier New",monospace}
.cf h2.ttl{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.1}
.cf .lede{margin:4px 0 0;color:var(--muted);max-width:65ch}
.dossiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dossier{position:relative;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:4px 14px 4px 4px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;min-width:0}
.dossier::before{content:"";position:absolute;top:-12px;left:0;width:42%;height:14px;background:var(--paper2);border-radius:8px 8px 0 0}
.dossier:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.dossier{transition:transform .15s}}
.dossier .no{font-family:var(--type);font-size:13px;color:var(--inkm)}
.dossier h3{margin:0;font-family:var(--type);font-size:24px;line-height:1.15;font-weight:400}
.dossier p{margin:0;font-size:14px;color:#4a4033}
.dossier .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--inkm);margin-top:8px;font-weight:600}
.dossier .best{color:#2f6b3f}
.stamp{position:absolute;top:16px;right:14px;transform:rotate(8deg);border:2px solid var(--stamp);color:var(--stamp);font-family:var(--type);font-size:12px;letter-spacing:.12em;padding:2px 8px;border-radius:4px;opacity:.85}

.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.steps li.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.steps li.done{color:var(--good)}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:24px clamp(16px,3vw,32px);box-shadow:0 14px 40px rgba(0,0,0,.4);position:relative;min-width:0}
.paper h3{font-family:var(--type);font-weight:400;font-size:28px;margin:0 0 4px;line-height:1.15;text-wrap:balance}
.paper .dl{font-family:var(--type);color:var(--inkm);font-size:14px;margin:0 0 12px}
.paper .brief{font-size:16px;line-height:1.6;max-width:68ch;margin:0 0 6px}
.paper .stamp{font-size:15px;top:22px;right:20px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
.board-head h4{margin:0;font-family:var(--type);font-weight:400;font-size:20px}
.pts{font-weight:700;font-size:14px;color:var(--stamp)}
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.clue{background:#fbf7ec;border:1px solid #d9ccb0;border-radius:4px;padding:12px 14px;box-shadow:0 2px 0 #d9ccb0;min-width:0}
.clue:nth-child(3n+1){transform:rotate(-.6deg)}.clue:nth-child(3n+2){transform:rotate(.5deg)}
.clue .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--stamp)}
.clue b{display:block;font-size:15px;margin:2px 0 4px;line-height:1.3}
.clue p{margin:0;font-size:14px;color:#4a4033;line-height:1.45}
.clue .when{font-family:var(--type);font-size:12px;color:var(--inkm);margin-top:6px}
.clue.locked{background:repeating-linear-gradient(135deg,#e9dfc8 0 10px,#e3d8bf 10px 20px);display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.clue.locked p{color:var(--inkm)}
.inv{align-self:flex-start;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:6px 12px;font-weight:700;font-size:13px}
.inv:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.pbtn{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.pbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--inkm)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.q{margin:0 0 18px}
.q .qt{font-weight:700;font-size:16px;margin:0 0 8px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:#fbf7ec;border:1px solid #d9ccb0;border-radius:8px;padding:9px 12px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}

<script>

const W = 960, H = 520, N = W * H, CELL_KM2 = 1600, CELL_KM = 40;
const SHAPES = { continents:{land:.33, amp:.6}, pangaea:{land:.36, amp:.5}, twin:{land:.32, amp:.58}, archipelago:{land:.26, amp:.78} };

/* The five nations, in seeding order */

   desc:'Mountains and desert in the west, wide plains and a farm belt in the middle, forests, lakes and swamps in the east.',
   known:'Wheat, corn, cattle, timber, oil',

  {name:'Highpeak', capital:'Summit', terrain:'Mountains',

  {name:'Goldfield', capital:'Harvest', terrain:'Farmland',

  {name:'Ironvale', capital:'Forge', terrain:'Raw materials',

];
const MINERALS = [
  {name:'Iron', col:'#8c4a3a'}, {name:'Coal', col:'#2e2e2e'}, {name:'Copper', col:'#c97a3c'},
  {name:'Gold', col:'#e2b23c'}, {name:'Stone', col:'#a3a39c'}
];
const WORLD_NAMES = ['Terra Nova','Aurelia','Verdana','Solara','Meridia','Novaterra','Elara','Brightland','Calandra','Avalon'];
const CONT_NAMES = ['Arcadia','Borea','Austra','Orientis','Westmere','Nova','Terra Alta','Solenne'];
const SPARE_SEAS = ['Silver Sea','Coral Sea','Storm Sea','Pearl Sea','Blue Bay','Calm Sea'];

/* biome codes */
const ROCK=1, FOREST=2, FIELDS=3, DESERT=4, PRAIRIE=5, EARTH=6, SWAMP=7, MEADOW=8, QUARRY=9;

/* ---------- random + noise ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(r){
  const p=new Uint8Array(512), b=new Uint8Array(256);
  for(let i=0;i<256;i++)b[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}
  for(let i=0;i<512;i++)p[i]=b[i&255];
  const g=(h,x,y)=>{switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y}};
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  function n(x,y){const X=Math.floor(x),Y=Math.floor(y),xf=x-X,yf=y-Y,xi=X&255,yi=Y&255;
    const aa=p[p[xi]+yi],ab=p[p[xi]+yi+1],ba=p[p[xi+1]+yi],bb=p[p[xi+1]+yi+1];
    const u=fade(xf),v=fade(yf);
    const x1=g(aa,xf,yf)+u*(g(ba,xf-1,yf)-g(aa,xf,yf));
    const x2=g(ab,xf,yf-1)+u*(g(bb,xf-1,yf-1)-g(ab,xf,yf-1));

}

/* ---------- landmass blobs ---------- */
function makeBlobs(shape,r){
  const B=[],add=(cx,cy,rx,ry,w)=>B.push({cx:cx*W,cy:cy*H,rx:rx*W,ry:ry*H,w});
  if(shape==='pangaea'){
    add(.5+(r()-.5)*.1,.5+(r()-.5)*.08,.31+r()*.05,.37+r()*.05,1);
    for(let i=0;i<4;i++)add(.5+(r()-.5)*.55,.5+(r()-.5)*.6,.08+r()*.08,.12+r()*.12,.85);
  }else if(shape==='twin'){
    add(.3+(r()-.5)*.06,.5+(r()-.5)*.2,.19+r()*.04,.34+r()*.08,1);
    add(.75+(r()-.5)*.06,.5+(r()-.5)*.2,.13+r()*.04,.3+r()*.08,.95);
    for(let i=0;i<3;i++)add(.15+r()*.7,.15+r()*.7,.03+r()*.04,.05+r()*.06,.75);
  }else if(shape==='archipelago'){
    add(.5+(r()-.5)*.3,.5+(r()-.5)*.2,.12+r()*.04,.2+r()*.06,1);
    const k=18+Math.floor(r()*8);
    for(let i=0;i<k;i++)add(.07+r()*.86,.14+r()*.72,.022+r()*.05,.04+r()*.08,.7+r()*.3);
  }else{
    add(.4+(r()-.5)*.2,.5+(r()-.5)*.2,.2+r()*.05,.3+r()*.06,1);
    const k=3+Math.floor(r()*2),pts=[[B[0].cx/W,B[0].cy/H]];
    for(let t=0;t<400&&pts.length<k+1;t++){
      const cx=.12+r()*.76,cy=.2+r()*.6;
      if(pts.every(p=>Math.hypot(p[0]-cx,(p[1]-cy)*.55)>.26)){pts.push([cx,cy]);add(cx,cy,.07+r()*.07,.12+r()*.14,.85+r()*.15)}
    }
    for(let i=0;i<4;i++)add(.08+r()*.84,.12+r()*.76,.02+r()*.03,.03+r()*.05,.65);
  }
  return B;
}

/* ---------- grid helpers ---------- */
function components(set){
  const comp=new Int32Array(N).fill(-1),sizes=[],edge=[],st=new Int32Array(N);
  for(let i=0;i<N;i++){
    if(!set[i]||comp[i]>=0)continue;
    const id=sizes.length;let sp=0,size=0,e=false;st[sp++]=i;comp[i]=id;
    while(sp){const c=st[--sp];size++;const x=c%W;
      if(x===0||x===W-1||c<W||c>=N-W)e=true;
      if(x>0&&set[c-1]&&comp[c-1]<0){comp[c-1]=id;st[sp++]=c-1}
      if(x<W-1&&set[c+1]&&comp[c+1]<0){comp[c+1]=id;st[sp++]=c+1}
      if(c>=W&&set[c-W]&&comp[c-W]<0){comp[c-W]=id;st[sp++]=c-W}
      if(c<N-W&&set[c+W]&&comp[c+W]<0){comp[c+W]=id;st[sp++]=c+W}}
    sizes.push(size);edge.push(e);
  }
  return {comp,sizes,edge};
}
function nbAny(i,pred){const x=i%W;return (x>0&&pred(i-1))||(x<W-1&&pred(i+1))||(i>=W&&pred(i-W))||(i<N-W&&pred(i+W))}
function onEdge(i){const x=i%W;return x===0||x===W-1||i<W||i>=N-W}
function bfs(isSrc,pass){
  const d=new Int16Array(N).fill(-1),q=new Int32Array(N);let h=0,t=0;
  for(let i=0;i<N;i++)if(isSrc(i)){d[i]=0;q[t++]=i}
  while(h<t){const i=q[h++],nd=d[i]+1,x=i%W;
    if(x>0&&d[i-1]<0&&pass(i-1,i)){d[i-1]=nd;q[t++]=i-1}
    if(x<W-1&&d[i+1]<0&&pass(i+1,i)){d[i+1]=nd;q[t++]=i+1}
    if(i>=W&&d[i-W]<0&&pass(i-W,i)){d[i-W]=nd;q[t++]=i-W}
    if(i<N-W&&d[i+W]<0&&pass(i+W,i)){d[i+W]=nd;q[t++]=i+W}}
  return d;
}
class Heap{constructor(){this.k=[];this.v=[];this.lastK=0}
  get size(){return this.k.length}
  push(key,val){const K=this.k,V=this.v;let i=K.length;K.push(key);V.push(val);
    while(i>0){const p=(i-1)>>1;if(K[p]<=key)break;K[i]=K[p];V[i]=V[p];i=p}K[i]=key;V[i]=val}
  pop(){const K=this.k,V=this.v,top=V[0];this.lastK=K[0];const lk=K.pop(),lv=V.pop(),n=K.length;
    if(n>0){let i=0;for(;;){const l=2*i+1;if(l>=n)break;const rr=l+1,c=(rr<n&&K[rr]<K[l])?rr:l;if(K[c]>=lk)break;K[i]=K[c];V[i]=V[c];i=c}K[i]=lk;V[i]=lv}
    return top}}

/* ---------- world generation ---------- */
function generate(seed,shape){
  const r=mulberry32(hashStr(seed+'|'+shape+'|five'));
  const fbm=makeNoise(mulberry32(hashStr(seed+'|'+shape)));
  const B=makeBlobs(shape,mulberry32(hashStr(seed+'#'+shape))), cfg=SHAPES[shape];

  // elevation
  const e=new Float32Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const wx=x+62*fbm(x/220+5.2,y/220+1.3,3), wy=y+62*fbm(x/220+9.7,y/220+4.1,3);
    let m=-1e9;
    for(const b of B){const dx=(wx-b.cx)/b.rx,dy=(wy-b.cy)/b.ry,v=b.w*(1-Math.sqrt(dx*dx+dy*dy));if(v>m)m=v}
    let v=m+cfg.amp*fbm(wx/120,wy/120,6);
    const f=Math.min(1,Math.min(x,W-1-x)/(W*.05),Math.min(y,H-1-y)/(H*.08));
    v-=(1-f)*.9;
    e[x+y*W]=v;
  }
  const sorted=e.slice().sort();
  const sea=sorted[Math.floor(N*(1-cfg.land))], erange=Math.max(1e-3,sorted[N-1]-sea);

  // tidy: fill tiny lakes, drop specks
  const land=new Uint8Array(N);
  for(let i=0;i<N;i++)land[i]=e[i]>sea?1:0;
  const water=new Uint8Array(N);for(let i=0;i<N;i++)water[i]=1-land[i];
  let wc=components(water);
  for(let i=0;i<N;i++)if(water[i]){const c=wc.comp[i];if(!wc.edge[c]&&wc.sizes[c]<60){land[i]=1;e[i]=sea+.002}}
  let lc=components(land);
  for(let i=0;i<N;i++)if(land[i]&&lc.sizes[lc.comp[i]]<10){land[i]=0;e[i]=sea-.002}
  for(let i=0;i<N;i++)water[i]=1-land[i];
  wc=components(water);lc=components(land);
  const ocean=new Uint8Array(N);for(let i=0;i<N;i++)ocean[i]=water[i]&&wc.edge[wc.comp[i]]?1:0;

  const landDist=bfs(i=>land[i]&&(onEdge(i)||nbAny(i,j=>!land[j])),j=>land[j]);

  const cost=new Float32Array(N);
  for(let i=0;i<N;i++)if(land[i]){const x=i%W,y=(i-x)/W,h=(e[i]-sea)/erange;
    cost[i]=1+Math.max(0,Math.min(1,fbm(x/50+11,y/50+3,3)+.5))*3+(h>.55?(h-.55)*12:0)}

  // all five nations start on the biggest landmass; Skyline starts at its heart and grows fastest
  const biggest=lc.sizes.indexOf(Math.max(...lc.sizes)), cells=[];
  for(let i=0;i<N;i++)if(land[i]&&lc.comp[i]===biggest)cells.push(i);
  let heart=cells[0];for(const i of cells)if(landDist[i]>landDist[heart])heart=i;
  const seeds=[heart];let minD=Math.sqrt(cells.length/5)*.85;
  for(let t=0;t<9000&&seeds.length<5;t++){
    if(t&&t%600===0)minD*=.85;
    const i=cells[Math.floor(r()*cells.length)];
    if(landDist[i]<3&&t<6000)continue;
    const x=i%W,y=(i-x)/W;
    if(seeds.every(p=>Math.hypot(p%W-x,(p-p%W)/W-y)>=minD))seeds.push(i);
  }
  const C=seeds.length, country=new Int16Array(N).fill(-1), dist=new Float32Array(N).fill(Infinity);
  const mult=[.5,1,1,1,1].map(m=>m*(.9+r()*.2)), heap=new Heap();
  seeds.forEach((s,c)=>{dist[s]=0;country[s]=c;heap.push(0,s)});
  while(heap.size){
    const i=heap.pop(),di=heap.lastK;if(di>dist[i])continue;
    const c=country[i],x=i%W,m=mult[c];
    const go=j=>{if(!land[j])return;const nd=di+cost[j]*m;if(nd<dist[j]){dist[j]=nd;country[j]=c;heap.push(nd,j)}};
    if(x>0)go(i-1);if(x<W-1)go(i+1);if(i>=W)go(i-W);if(i<N-W)go(i+W);
  }
  {const owner=country.slice(),q=new Int32Array(N);let h=0,t=0;
    for(let i=0;i<N;i++)if(owner[i]>=0)q[t++]=i;
    while(h<t){const i=q[h++],o=owner[i],x=i%W;
      if(x>0&&owner[i-1]<0){owner[i-1]=o;q[t++]=i-1}
      if(x<W-1&&owner[i+1]<0){owner[i+1]=o;q[t++]=i+1}
      if(i>=W&&owner[i-W]<0){owner[i-W]=o;q[t++]=i-W}
      if(i<N-W&&owner[i+W]<0){owner[i+W]=o;q[t++]=i+W}}
    for(let i=0;i<N;i++)if(land[i]&&country[i]<0)country[i]=owner[i];}

  // ---- reshape the land to fit each nation's character ----
  const bd0=bfs(i=>land[i]&&(onEdge(i)||nbAny(i,j=>!land[j]||country[j]!==country[i])),(j,i)=>land[j]&&country[j]===country[i]);
  let minX=W,maxX=0,minY=H,maxY=0;
  for(const i of cells)if(country[i]===0){const x=i%W,y=(i-x)/W;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  const cw=Math.max(1,maxX-minX), ch=Math.max(1,maxY-minY);
  const uOf=i=>Math.max(0,Math.min(1,(i%W-minX)/cw)), vOf=i=>Math.max(0,Math.min(1,(Math.floor(i/W)-minY)/ch));
  const ridge=(x,y,f)=>{const v=1-Math.abs(fbm(x/f+31,y/f+17,4))*2.2;return v<0?0:v*v};
  const bell=(t,c,w)=>{const q=(t-c)/w;return Math.exp(-q*q)};
  for(let i=0;i<N;i++){
    if(!land[i])continue;
    const x=i%W,y=(i-x)/W,c=country[i];
    let ef=Math.min(1,bd0[i]/10);ef=ef*ef*(3-2*ef);
    const base=Math.max(0,e[i]-sea);let ne;
    if(c===1)ne=erange*(.2+.08*ef+.8*ridge(x,y,26)*ef);                // Highpeak: ranges everywhere
    else if(c===4)ne=erange*(.12+.4*ridge(x,y,20)*ef);                 // Ironvale: rugged hills
    else if(c===3)ne=base*.15;                                          // Goldfield: flat
    else if(c===2)ne=base*.4+erange*.1*ridge(x,y,30)*ef;                // Greenwood: rolling
    else{const u=uOf(i);ne=base*.22+erange*ef*ridge(x,y,24)*(.95*bell(u,.2,.12)+.45*bell(u,.8,.05))} // Skyline: western ranges, low eastern ridge
    e[i]=sea+Math.max(.001,ne);
  }
  // Skyline's great lakes in the north-centre
  if(cw>110&&ch>60){
    const lakes=[[.58,.13,.04,.06],[.66,.2,.035,.07],[.73,.12,.04,.05]];
    for(const i of cells){
      if(country[i]!==0||bd0[i]<5)continue;
      const x=i%W,y=(i-x)/W;
      for(const [lu,lv,rx,ry] of lakes){
        const dx=(x-(minX+lu*cw))/(rx*cw),dy=(y-(minY+lv*ch))/(ry*ch);
        if(dx*dx+dy*dy+.5*fbm(x/9+90,y/9,2)<1){land[i]=0;country[i]=-1;e[i]=sea-.01;break}
      }
    }
  }
  // biomes
  const biome=new Uint8Array(N);
  for(let i=0;i<N;i++){
    if(!land[i])continue;
    const x=i%W,y=(i-x)/W,c=country[i],h=(e[i]-sea)/erange;let b;
    if(c===1)b=h>.6?ROCK:MEADOW;
    else if(c===2)b=h>.7?ROCK:FOREST;
    else if(c===3)b=FIELDS;
    else if(c===4)b=h>.68?ROCK:(fbm(x/14+50,y/14,2)>.18?QUARRY:EARTH);
    else{const u=uOf(i),v=vOf(i);
      if(h>.55)b=ROCK;
      else if(u<.08&&v<.5)b=FOREST;
      else if(u<.36)b=v>.55?DESERT:MEADOW;
      else if(u<.5)b=v>.62?DESERT:PRAIRIE;
      else if(u<.7)b=fbm(x/18+70,y/18,2)>-.05?FIELDS:PRAIRIE;
      else b=v>.72?SWAMP:FOREST;}
    biome[i]=b;
  }

  // ---- stats, labels, symbols ----
  const area=new Int32Array(C), maxE=new Float32Array(C).fill(-1e9);
  for(let i=0;i<N;i++)if(land[i]){const c=country[i];area[c]++;if(e[i]>maxE[c])maxE[c]=e[i]}
  const bd=bfs(i=>land[i]&&(onEdge(i)||nbAny(i,j=>!land[j]||country[j]!==country[i])),(j,i)=>land[j]&&country[j]===country[i]);
  const labelCell=new Int32Array(C).fill(-1), labelDist=new Int16Array(C).fill(-1);
  for(let i=0;i<N;i++)if(land[i]){const c=country[i];if(bd[i]>labelDist[c]){labelDist[c]=bd[i];labelCell[c]=i}}
  const nbrs=Array.from({length:C},()=>new Set());
  for(let i=0;i<N;i++){if(!land[i])continue;const a=country[i];
    if(i%W<W-1&&land[i+1]&&country[i+1]!==a){nbrs[a].add(country[i+1]);nbrs[country[i+1]].add(a)}
    if(i<N-W&&land[i+W]&&country[i+W]!==a){nbrs[a].add(country[i+W]);nbrs[country[i+W]].add(a)}}
  const cellsOf=Array.from({length:C},(_,c)=>new Int32Array(area[c])), fi=new Int32Array(C);
  for(let i=0;i<N;i++)if(land[i]){const c=country[i];cellsOf[c][fi[c]++]=i}

  const waterDist=bfs(i=>!land[i]&&nbAny(i,j=>land[j]),j=>!land[j]);

  // continents (for the header only)
  const lc2=components(land), thresh=Math.max(N*.36*.045,1800);
  const contCount=lc2.sizes.filter(s=>s>=thresh).length||1;
  const contNames=[...CONT_NAMES].sort(()=>r()-.5).slice(0,Math.min(contCount,CONT_NAMES.length));

  // seas, named by where they sit
  const cand=[];for(let i=0;i<N;i+=3)if(ocean[i]&&waterDist[i]>=18)cand.push(i);
  cand.sort((a,b)=>waterDist[b]-waterDist[a]);
  const seas=[],usedSea=new Set();
  for(const i of cand){if(seas.length>=5)break;const x=i%W,y=(i-x)/W;
    if(!seas.every(s=>Math.hypot(s.cell%W-x,(s.cell-s.cell%W)/W-y)>=220))continue;
    const ns=y<H*.35?'North':y>H*.65?'South':'', ew=x<W*.33?'west':x>W*.67?'east':'';
    let name=ns&&ew?`${ns}${ew} Sea`:ns?`${ns} Sea`:ew?(ew==='west'?'Western Ocean':'Eastern Ocean'):'Central Sea';
    if(usedSea.has(name))name=SPARE_SEAS.find(s=>!usedSea.has(s));
    usedSea.add(name);seas.push({cell:i,name});}

  const symbols=[], minerals=[0,0,0,0,0], step=10;
  for(let gy=3;gy<H-3;gy+=step)for(let gx=3;gx<W-3;gx+=step){
    const x=Math.min(W-2,gx+Math.floor(r()*step*.8)),y=Math.min(H-2,gy+Math.floor(r()*step*.8)),i=x+y*W;
    if(!land[i]||bd[i]<3)continue;
    const b=biome[i],h=(e[i]-sea)/erange,q=r();let t=null,v=0;
    if(h>.58&&b!==FIELDS)t='mtn';
    else if(b===FOREST)t=q<.85?'tree':null;
    else if(b===MEADOW)t=q<.45?'pine':null;
    else if(b===DESERT)t=q<.35?'cactus':null;
    else if(b===FIELDS)t=q<.16?'barn':null;
    else if(b===PRAIRIE)t=q<.18?'grass':null;
    else if(b===SWAMP)t=q<.5?'reed':null;
    else if(b===EARTH||b===QUARRY){if(q<.5){t='ore';v=Math.floor(r()*5);minerals[v]++}else if(q<.75)t='hill'}
    if(t)symbols.push({x,y,t,v,h,odd:((gx+gy)/step)%2});
  }

  const nations=[];
  for(let c=0;c<C;c++){
    const ly=Math.floor(labelCell[c]/W);
    nations.push({id:c,...NATIONS[c],area:area[c],cell:labelCell[c],ld:labelDist[c],
      peak:Math.max(40,Math.round(((maxE[c]-sea)/erange)*6800/10)*10),
      lat:(.5-ly/H)*180*.95,nbrs:[...nbrs[c]]});
  }
  return {seed,shape,name:WORLD_NAMES[Math.floor(r()*WORLD_NAMES.length)],e,sea,erange,land,ocean,waterDist,country,biome,uOf,cellsOf,nations,contNames,seas,symbols,minerals};
}


function drawSym(ctx,s,x,y,z,dpr){
  ctx.lineWidth=Math.max(.8,.9*dpr);
  switch(s.t){
    case 'mtn':{const w=z*1.05,hh=z*(.9+Math.min(1,s.h)*.6),by=y+z*.45;
      ctx.beginPath();ctx.moveTo(x-w,by);ctx.lineTo(x,by-hh);ctx.lineTo(x+w,by);ctx.closePath();ctx.fillStyle='#cfc4b0';ctx.fill();
      ctx.beginPath();ctx.moveTo(x,by-hh);ctx.lineTo(x+w,by);ctx.lineTo(x,by);ctx.closePath();ctx.fillStyle='#9b8d78';ctx.fill();
      if(s.h>.8){ctx.beginPath();ctx.moveTo(x-w*.32,by-hh*.68);ctx.lineTo(x,by-hh);ctx.lineTo(x+w*.32,by-hh*.68);ctx.lineTo(x,by-hh*.76);ctx.closePath();ctx.fillStyle='#fbfaf6';ctx.fill()}
      ctx.beginPath();ctx.moveTo(x-w,by);ctx.lineTo(x,by-hh);ctx.lineTo(x+w,by);ctx.strokeStyle='#5e5246';ctx.stroke();break}
    case 'tree':{ctx.strokeStyle='#6b4e34';ctx.lineWidth=Math.max(1,z*.18);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+z*.55);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y-z*.15,z*.48,0,Math.PI*2);ctx.fillStyle='#5d8a50';ctx.fill();ctx.lineWidth=Math.max(.8,.8*dpr);ctx.strokeStyle='#3f6638';ctx.stroke();break}
    case 'pine':{ctx.beginPath();ctx.moveTo(x,y-z*.7);ctx.lineTo(x+z*.38,y+z*.4);ctx.lineTo(x-z*.38,y+z*.4);ctx.closePath();ctx.fillStyle='#4d7a4b';ctx.fill();ctx.strokeStyle='#355a35';ctx.stroke();break}
    case 'cactus':{ctx.strokeStyle='#5f8f4e';ctx.lineCap='round';ctx.lineWidth=Math.max(1.2,z*.2);ctx.beginPath();
      ctx.moveTo(x,y+z*.5);ctx.lineTo(x,y-z*.5);ctx.moveTo(x,y);ctx.lineTo(x-z*.3,y);ctx.lineTo(x-z*.3,y-z*.3);ctx.moveTo(x,y+z*.1);ctx.lineTo(x+z*.3,y+z*.1);ctx.lineTo(x+z*.3,y-z*.2);ctx.stroke();ctx.lineCap='butt';break}
    case 'barn':{const a=z*.42;ctx.beginPath();ctx.moveTo(x-a,y+a);ctx.lineTo(x-a,y-a*.2);ctx.lineTo(x,y-a);ctx.lineTo(x+a,y-a*.2);ctx.lineTo(x+a,y+a);ctx.closePath();ctx.fillStyle='#b14d3f';ctx.fill();ctx.strokeStyle='#6e2c24';ctx.stroke();break}
    case 'grass':{ctx.strokeStyle='#8a9a55';ctx.beginPath();for(const o of [-.3,0,.3]){ctx.moveTo(x+o*z,y+z*.3);ctx.lineTo(x+o*z*1.6,y-z*.3)}ctx.stroke();break}
    case 'reed':{ctx.strokeStyle='#5f8a5a';ctx.beginPath();ctx.moveTo(x-z*.2,y+z*.35);ctx.lineTo(x-z*.25,y-z*.35);ctx.moveTo(x+z*.15,y+z*.35);ctx.lineTo(x+z*.2,y-z*.25);ctx.moveTo(x-z*.5,y+z*.35);ctx.lineTo(x+z*.5,y+z*.35);ctx.stroke();break}
    case 'hill':{ctx.strokeStyle='#8f6f52';ctx.lineWidth=Math.max(1,z*.16);ctx.beginPath();ctx.arc(x,y+z*.3,z*.5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();break}
    case 'ore':{const a=z*.5;ctx.beginPath();ctx.moveTo(x,y-a);ctx.lineTo(x+a,y);ctx.lineTo(x,y+a);ctx.lineTo(x-a,y);ctx.closePath();
      ctx.fillStyle=MINERALS[s.v].col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,1.2*dpr);ctx.stroke();break}
  }
}

/* Presidents of the five nations, drawn in the user's hand-drawn style:
   big round head, giant outlined eyes with highlights, thick black outlines, flat colour with darker hatching,
   antenna lashes, stick legs. Each returns a full SVG (viewBox 300 × 620). */
const PRES = (() => {
const K = "#111";
const O = (w = 7) => `stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

function fresh(name){
  const prices={},hist={},hold={};
  GOODS.forEach(g=>{prices[g.id]=g.p;hist[g.id]=[g.p];hold[g.id]=0});
  return {name:name||'Hale',capital:START.capital,prices,hist,hold,stabBase:START.stab,rel:{...START.rel},
    flags:{},contractRaw:0,contractDeposit:0,grainC:null,chap:0,lessons:[],log:[],scene:0,beat:0,queue:[],rng:mulberry32(hashStr('tw|'+(name||'Hale')))};
}
const fmt=n=>'£'+Math.round(n).toLocaleString('en-GB');
const holdValue=()=>GOODS.reduce((s,g)=>s+S.hold[g.id]*S.prices[g.id],0);
const grainCValue=()=>S.grainC&&S.grainC.status==="active"?S.grainC.deposit+S.grainC.qty*(S.prices.grain-S.grainC.price):0;
const contractValue=()=>(S.flags.contract?S.contractDeposit+S.contractRaw*(S.prices.raw-S.flags.contract):0)+grainCValue();
const grainStock=()=>S.hold.grain+(S.grainC&&S.grainC.status==="active"?S.grainC.qty:0);
const portfolio=()=>S.capital+holdValue()+contractValue();
const funding=()=>START.capital+(S.injected||0);
function fund(n){S.capital+=n;S.injected=(S.injected||0)+n}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function stability(){
  const raw=S.hold.raw+S.contractRaw;
  return Math.round(clamp(S.stabBase+Math.min(12,raw*.2)+Math.min(10,grainStock()*.08)+Math.min(6,S.hold.def*.3),0,100));
}
function risk(){
  // essentials (grain, metals) protect the economy; only speculative goods count towards market exposure
  const SPEC=['semi','mach','def','gold'],sv=SPEC.map(id=>S.hold[id]*S.prices[id]),hv=sv.reduce((a,b)=>a+b,0),pv=Math.max(1,portfolio());let r=18;
  if(!S.flags.alt)r+=20;                       // Skyline still leans on Greenwood's factories
  if(S.flags.contract)r+=6;                    // one big supplier
  if(hv>0){const mx=Math.max(...sv)/hv;r+=mx*25*(hv/pv>.15?1:.4)}
  r+=Math.max(0,hv/pv-.5)*70;                  // too much money riding on the markets
  if(S.hold.raw+S.contractRaw<20)r+=10;        // thin supply of metals
  if(S.chap>=1&&!(S.grainC&&S.grainC.from==="alt"&&S.grainC.status!=="broken"))r+=6; // grain still depends on Goldfield
  if(S.flags.chipAlt)r-=6;if(S.flags.retool)r-=6;
  return Math.round(clamp(r,0,100));
}
const riskLabel=r=>r<35?'Low':r<60?'Moderate':'High';
function shockBy(m){
  GOODS.forEach(g=>{const noise=1+(S.rng()-.5)*.04;S.prices[g.id]=Math.round(S.prices[g.id]*(m[g.id]??1)*noise);S.hist[g.id].push(S.prices[g.id])});
}
function shock(key){shockBy(SHOCKS[key])}
function rel(n,d){S.rel[n]=clamp(S.rel[n]+d,-100,100)}
function txt(t){return (typeof t==='function'?t(S):t).replaceAll('{name}',S.name)}

function grainContractOutcome(){

function buildMap(){
  const w=world,img=new ImageData(W,H),d=img.data,deep=[18,38,48],shallow=[44,79,92],coast=[13,26,31],cont=[90,134,150];
  for(let i=0;i<N;i++){
    let col;const x=i%W,y=(i-x)/W;
    if(!w.land[i]){
      const wd=w.waterDist[i]<0?99:w.waterDist[i];let t=Math.min(1,wd/38);t=t*t*(3-2*t);
      col=w.ocean[i]?mixC(shallow,deep,t):shallow;if(w.ocean[i]&&(wd===5||wd===11))col=mixC(col,cont,.4);
    }else{
      const b=w.biome[i];
      if(b===3){const px=x+y*.4,a=Math.floor(px/9),bq=Math.floor(y/6),hs=(Math.imul(a,73856093)^Math.imul(bq,19349663))>>>0;
        col=[[236,217,143],[194,217,140],[217,191,142],[169,201,127]][hs%4];if(px%9<1||y%6<1)col=mixC(col,[150,130,90],.28)}
      else if(b===5)col=mixC([224,209,151],[199,214,144],w.uOf(i));
      else col=B_RGB[b]||B_RGB[8];
      const h=(w.e[i]-w.sea)/w.erange;
      if(h>.5)col=mixC(col,[156,143,124],Math.min(.7,(h-.5)*1.6));
      if(h>.84)col=mixC(col,[244,242,236],Math.min(.9,(h-.84)*6));
      const xl=x>0?i-1:i,xr=x<W-1?i+1:i,yu=i>=W?i-W:i,yd=i<N-W?i+W:i;
      const sh=Math.max(.74,Math.min(1.15,1+(-(w.e[xr]-w.e[xl])-(w.e[yd]-w.e[yu]))*4.5/w.erange));
      col=[col[0]*sh,col[1]*sh,col[2]*sh];
      const c=w.country[i];
      if(nbAny(i,j=>!w.land[j]))col=coast;
      else if((x<W-1&&w.land[i+1]&&w.country[i+1]!==c)||(i<N-W&&w.land[i+W]&&w.country[i+W]!==c))col=[92,70,82];
    }

  }

/* ===================== engine ===================== */
const layer=document.getElementById('layer'),portrait=document.getElementById('portrait'),bgEl=document.getElementById('bg');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let typing=null,advanceLock=false;

function curBeat(){return S.queue[S.beat]}
const chapter=()=>CHAPTERS[S.chap];
function startScene(i){
  S.scene=i;S.beat=0;const ch=chapter(),sc=ch.scenes[i];
  S.queue=[...(i===0?[{chaptercard:true}]:[]),{scenecard:true},...sc.beats];
  document.getElementById('chapLabel').innerHTML=`Chapter ${ch.num}: ${ch.title}<small>Scene ${sc.num} · ${sc.title}</small>`;
  run();
}
function next(){S.beat++;if(S.beat>=S.queue.length){if(S.scene+1<chapter().scenes.length)startScene(S.scene+1)}else run()}
function run(){
  const b=curBeat();if(!b)return;
  hud();
  if(b.bg){bgEl.className='bg bg-'+b.bg;return next()}
  if(b.fx){b.fx();hud();return next()}
  if(b.toast){showToast(b.toast);return next()}
  if(b.dyn){const extra=b.dyn()||[];S.queue.splice(S.beat+1,0,...extra);hud();return next()}
  if(b.chaptercard){const ch=chapter();portraitOff();showMap(null);
    return card(`<div class="scenecard"><p class="num">CHAPTER ${ch.num}</p><h2>${ch.title}</h2><p>${ch.sub}</p><button class="btn" data-go>Start chapter</button></div>`)}
  if('map' in b){showMap(b.map,b.focus);if(!b.narr&&!b.who)return next()}
  if(b.scenecard){const sc=chapter().scenes[S.scene];portraitOff();
    return card(`<div class="scenecard"><p class="num">SCENE ${sc.num}</p><h2>${sc.title}</h2><p>${sc.sub}</p><button class="btn" data-go>Begin</button></div>`)}
  if(b.who||b.narr)return say(b);
  if(b.news){portraitOff();layer.innerHTML=`<div class="news" role="alert"><div class="tag"><span>BREAKING NEWS</span><span>GNN</span></div><h3>${b.news.head}</h3><p>${b.news.text}</p></div>
     <div class="dialog"><p class="line narr">Tap or press space to continue.</p><span class="next">Next ▸</span></div>`;return}
  if(b.choice)return choose(b.choice);
  if(b.trade)return openTerminal(b.trade);
  if(b.budget)return openBudget(b.budget);
  if(b.lesson){S.lessons.push(b.lesson);hud();portraitOff();
    return card(`<p class="eyebrow">Trade lesson unlocked</p><h2>${b.lesson.title}</h2><p>${b.lesson.text}</p><button class="btn" data-go>Got it</button>`)}
  if(b.end)return report();
}
function portraitOff(){portrait.classList.remove('on')}
function say(b){
  const c=b.who?CAST[b.who]:null;
  if(c){portrait.innerHTML=c.pres?PRES[c.pres]():avatar(b.who);portrait.className='portrait '+(c.pres?'tall ':'')+c.side+' on'}else portraitOff();
  const t=txt(b.who?b.text:b.narr);
  layer.innerHTML=`<div class="dialog">${c?`<div class="nameplate" style="background:${NCOL[c.n]};color:#0e1320">${c.name}<small>${c.role}</small></div>`:''}
    <p class="line${c?'':' narr'}" id="line"></p><span class="next">Next ▸</span></div>`;
  typeOut(document.getElementById('line'),t);
}
function typeOut(el,t){
  clearInterval(typing);if(reduced){el.textContent=t;typing=null;return}
  let i=0;el.textContent='';typing=setInterval(()=>{i+=2;el.textContent=t.slice(0,i);if(i>=t.length){clearInterval(typing);typing=null}},16);
  el.dataset.full=t;
}
function choose(ch){
  portraitOff();
  layer.innerHTML=`<div class="dialog"><div class="nameplate">Your decision</div><p class="prompt">${txt(ch.prompt)}</p><div class="choices">${
    ch.opts.map((o,k)=>{const ok=!o.need||S.capital>=o.need(S);
      return `<button class="choice" data-opt="${k}" ${ok?'':'disabled'}><span>${txt(o.label)}</span><small>${ok?(o.cost?txt(o.cost):''):'Not enough capital'}</small></button>`}).join('')}</div></div>`;
}
function card(html){layer.innerHTML=`<div class="card"><div>${html}</div></div>`;layer.querySelector('button')?.focus({preventScroll:true})}
function showToast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.getElementById('stage').appendChild(el);setTimeout(()=>el.remove(),2600)}

layer.addEventListener('click',ev=>{
  const b=curBeat();if(!b)return;
  const opt=ev.target.closest('[data-opt]');
  if(opt&&b.choice&&!opt.disabled){const o=b.choice.opts[+opt.dataset.opt];const reply=o.go()||[];S.queue.splice(S.beat+1,0,...reply);hud();return next()}
  if(ev.target.closest('[data-go]'))return next();
  if(b.who||b.narr||b.news)tapAdvance();
});
function tapAdvance(){
  const line=document.getElementById('line');
  if(typing&&line){clearInterval(typing);typing=null;line.textContent=line.dataset.full;return}
  next();
}
document.addEventListener('keydown',ev=>{
  if(!S||document.getElementById('panel-story').hidden||ev.target.closest('input,button,select'))return;
  const b=curBeat();if(!b)return;
  if((ev.key===' '||ev.key==='Enter')&&(b.who||b.narr||b.news)){ev.preventDefault();tapAdvance()}
});

/* ===================== trading terminal ===================== */
let tradeCfg=null,roundStart=null;
function spark(h){const w=70,hh=22,mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
  const pts=h.map((v,i)=>`${(i/(Math.max(1,h.length-1)))*w},${hh-2-((v-mn)/r)*(hh-4)}`).join(' ');
  const up=h[h.length-1]>=h[0];return `<svg width="${w}" height="${hh}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'#67d29a':'#f07470'}" stroke-width="1.8"/></svg>`}
function openTerminal(cfg){
  tradeCfg=cfg;portraitOff();showMap(null);
  roundStart={hold:{...S.hold},prices:{...S.prices},port:portfolio()};
  renderTerminal();
}
function renderTerminal(){
  const cfg=tradeCfg;
  const rows=GOODS.map(g=>{const h=S.hist[g.id],p=S.prices[g.id],prev=h.length>1?h[h.length-2]:h[0],ch=(p/prev-1)*100;
    const buyOK=S.capital>=p*g.lot, sellOK=S.hold[g.id]>=g.lot;
    return `<tr><td class="name">${g.name}<small>${g.note||'per '+g.unit}</small></td>
      <td>${fmt(p)}</td><td class="${ch>.05?'up':ch<-.05?'down':''}">${ch>0?'+':''}${ch.toFixed(1)}%</td><td>${spark(h)}</td>
      <td>${S.hold[g.id]} ${g.unit==='unit'?'':g.unit.slice(0,1)}</td><td>${fmt(S.hold[g.id]*p)}</td>
      <td><div class="qty"><button data-sell="${g.id}" ${sellOK?'':'disabled'} aria-label="Sell ${g.lot} ${g.name}">−${g.lot}</button><button data-buy="${g.id}" ${buyOK?'':'disabled'} aria-label="Buy ${g.lot} ${g.name}">+${g.lot}</button></div></td></tr>`}).join('');
  layer.innerHTML=`<div class="term">
    <header><h2>Skyline trading terminal<span>● MARKET OPEN</span></h2><p class="sub">${cfg.title} · ${cfg.sub}</p></header>
    <p class="hint">${cfg.hint}</p>
    <div class="tablewrap"><table><thead><tr><th>Good</th><th>Price</th><th>Change</th><th>Trend</th><th>You hold</th><th>Value</th><th>Trade</th></tr></thead><tbody>${rows}</tbody></table></div>
    <footer><span class="fig">Capital <b>${fmt(S.capital)}</b> · Holdings <b>${fmt(holdValue())}</b></span><button class="btn" data-endround>End trading round ▸</button></footer></div>`;
  hud();
}
layer.addEventListener('click',ev=>{
  if(!tradeCfg)return;
  const b=ev.target.closest('[data-buy],[data-sell],[data-endround],[data-afterround]');if(!b)return;
  ev.stopPropagation();
  if(b.dataset.buy){const g=GOODS.find(x=>x.id===b.dataset.buy),c=S.prices[g.id]*g.lot;if(S.capital>=c){S.capital-=c;S.hold[g.id]+=g.lot}renderTerminal()}
  else if(b.dataset.sell){const g=GOODS.find(x=>x.id===b.dataset.sell);if(S.hold[g.id]>=g.lot){S.hold[g.id]-=g.lot;S.capital+=S.prices[g.id]*g.lot}renderTerminal()}
  else if('endround' in b.dataset){
    const before={...S.prices};shock(tradeCfg.after);
    const lines=GOODS.filter(g=>S.hold[g.id]>0).map(g=>{const d=(S.prices[g.id]-before[g.id])*S.hold[g.id];return [g,d]});
    const total=lines.reduce((s,l)=>s+l[1],0);S.lastPL=total;
    S.log.push(`${tradeCfg.title}: ${total>=0?'gained':'lost'} ${fmt(Math.abs(total))} on market moves`);
    const moves=GOODS.map(g=>{const ch=(S.prices[g.id]/before[g.id]-1)*100;return `<tr><td>${g.name}</td><td class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(1)}%</td></tr>`}).join('');
    layer.innerHTML=`<div class="card"><div><p class="eyebrow">Market update</p><h2>${tradeCfg.news}</h2>
      <table class="pl">${moves}</table>
      <p>${lines.length?`Your holdings ${total>=0?'gained':'lost'} <b class="${total>=0?'up':'down'}">${fmt(Math.abs(total))}</b> in value.`:'You held nothing, so the moves didn\'t touch your money, but you didn\'t profit either.'}</p>
      <button class="btn" data-afterround>Continue</button></div></div>`;
    hud();
  }else if('afterround' in b.dataset){tradeCfg=null;next()}
},true);

/* ===================== budget challenge ===================== */
let budgetCfg=null,budgetSel=new Set();
function openBudget(cfg){budgetCfg=cfg;budgetSel=new Set();portraitOff();showMap(null);renderBudget()}
function budgetOpts(){return budgetCfg.opts.map(o=>({...o,c:Math.round(o.cost(S))}))}
function renderBudget(){
  const total=budgetCfg.total(S),opts=budgetOpts(),spent=opts.filter(o=>budgetSel.has(o.id)).reduce((s,o)=>s+o.c,0);
  layer.innerHTML=`<div class="card"><div><p class="eyebrow">Budget challenge</p><h2>${budgetCfg.title}</h2><p>${txt(budgetCfg.intro)}</p>
    <div class="bopts">${opts.map(o=>{const on=budgetSel.has(o.id),can=on||spent+o.c<=total;
      return `<button class="bopt" data-bopt="${o.id}" aria-pressed="${on}" ${can?'':'disabled'}><span><b>${o.label}</b><small>${o.desc}</small></span><em>${fmt(o.c)}</em></button>`}).join('')}</div>
    <div class="bbar"><span>Spent <b>${fmt(spent)}</b> of <b>${fmt(total)}</b></span><span>Left <b>${fmt(total-spent)}</b></span></div>
    <button class="btn" data-bdone>Confirm priorities</button></div></div>`;
}
layer.addEventListener('click',ev=>{
  if(!budgetCfg)return;
  const b=ev.target.closest('[data-bopt],[data-bdone]');if(!b)return;
  ev.stopPropagation();
  if(b.dataset.bopt){const id=b.dataset.bopt;budgetSel.has(id)?budgetSel.delete(id):budgetSel.add(id);return renderBudget()}
  const opts=budgetOpts(),chosen=opts.filter(o=>budgetSel.has(o.id)),missed=opts.filter(o=>!budgetSel.has(o.id)).map(o=>o.label.toLowerCase());
  chosen.forEach(o=>{S.capital-=o.c;o.go()});
  if(!chosen.length)S.log.push('Kept the emergency budget in cash');
  const reply=budgetCfg.done(missed);budgetCfg=null;S.queue.splice(S.beat+1,0,...reply);hud();next();
},true);

/* ===================== HUD ===================== */
function hud(){
  if(!S)return;
  const pv=portfolio(),d=(pv/funding()-1)*100,st=stability(),rk=risk();
  document.getElementById('hCap').textContent=fmt(S.capital);
  document.getElementById('hPort').textContent=fmt(pv);
  const pd=document.getElementById('hPortD');pd.textContent=(d>=0?'+':'')+d.toFixed(1)+'%';pd.className=d>=0?'up':'down';
  document.getElementById('hStab').textContent=st;
  const sf=document.getElementById('hStabF');sf.style.width=st+'%';sf.style.background=st<45?'var(--bad)':st<65?'var(--gold)':'var(--good)';
  document.getElementById('hRisk').textContent=`${riskLabel(rk)} · ${rk}`;
  const rf=document.getElementById('hRiskF');rf.style.width=rk+'%';rf.style.background=rk<35?'var(--good)':rk<60?'var(--gold)':'var(--bad)';
  document.getElementById('hRel').innerHTML=[1,2,3,4].map(n=>{const v=S.rel[n],l=v>=0?50:50+v/2,w=Math.abs(v)/2;
    return `<span><i class="dot" style="background:${NCOL[n]}"></i>${NAMES[n]}</span><span class="bar"><i style="left:${l}%;width:${w}%;background:${v>=0?'var(--good)':'var(--bad)'}"></i></span><b class="${v>=0?'up':'down'}">${v>0?'+':''}${v}</b>`}).join('');
  const hl=GOODS.filter(g=>S.hold[g.id]>0).map(g=>`${g.name}: ${S.hold[g.id]}`);if(S.contractRaw)hl.push(`Contract: ${S.contractRaw} t metals`);if(S.grainC&&S.grainC.status==='active')hl.push(`Contract: ${S.grainC.qty} t grain`);
  document.getElementById('hHold').textContent=hl.length?hl.join(' · '):'None yet';
  document.getElementById('lessonCount').textContent=S.lessons.length;
}

/* ===================== chapter report ===================== */
function profile(){
  const pv=portfolio(),pct=(pv/funding()-1)*100,st=stability(),rk=risk(),avg=(S.rel[2]+S.rel[3]+S.rel[4])/3;
  if(st<55)return ['The Economic Crisis','Shortages are looming. Skyline\'s factories and shops are running low, and the next shock could hit hard.'];
  if(pct>8&&rk>=60)return ['The Risk-Taker','Big gains, but a lot of money is riding on the markets. One bad turn could wipe it out.'];
  if(st>=65&&rk<55)return ['The Strategic Trader','Supplies secured, risks spread, options kept open. Steady hands in a crisis.'];
  if(S.rel[2]>=75)return ['The Loyal Ally','You put Greenwood first. That loyalty will matter when the rebuilding starts.'];
  if(pct>5&&avg<15)return ['The Opportunist','You made money from the panic, but the neighbours have noticed.'];
  return ['The Strategic Trader','Supplies secured, losses limited, options kept open. Steady hands in a crisis.'];
}
const SAVE_KEY='tw-save-v1';
function saveGame(nextChap){try{const {rng,queue,...rest}=S;localStorage.setItem(SAVE_KEY,JSON.stringify({...rest,chap:nextChap,scene:0,beat:0}))}catch(e){}}
function loadGame(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d||!CHAPTERS[d.chap])return null;d.rng=mulberry32(hashStr('tw|'+d.name+'|'+d.chap));d.queue=[];return d}catch(e){return null}}
function preset(chap,name){ // a typical position for players who jump straight to a later chapter
  S=fresh(name);S.capital=72000;S.hold.raw=40;S.flags={steady:1,early:1};S.rel={1:-15,2:75,3:10,4:25};S.stabBase=57;
  ['invasion','night1','week1'].forEach(shock);
  if(chap>=2){['ch2open','war2','collapse'].forEach(shock);S.capital=46000;S.hold.grain=60;S.hold.def=10;S.flags.sanctions='targeted';S.rel={1:-25,2:80,3:10,4:25};S.stabBase=52}
  S.injected=chap>=2?40000:0;S.chap=chap;return S;
}
function memories(){
  const f=S.flags,m=[];
  if(f.contract)m.push('Ironvale expects loyalty in return for your metals contract.');
  if(f.alt&&!f.copperDone)m.push('The Copperhill mine is being reopened. Its metal arrives later in the story.');
  if(f.copperDone)m.push('Copperhill is producing metal at home, safe from blockades.');
  if(f.promise)m.push('Greenwood counts on your promise of support.');
  if(f.distant)m.push('Greenwood remembers that you stayed out at first.');
  if(f.defUp)m.push('Highpeak sees Skyline as a growing threat.');
  if(f.diplo)m.push('Goldfield and Ironvale see you as someone they can talk to.');
  if(f.makedo)m.push('Skyline is rationing defence components.');
  if(S.grainC&&S.grainC.status==='active')m.push(S.grainC.from==='goldfield'?'Your grain contract is only as safe as Goldfield itself.':'Distant suppliers are holding 100 t of grain for you.');
  if(f.gBroken)m.push('Goldfield broke its grain contract when the storm hit.');
  if(f.sanctions==='full')m.push('Highpeak has banned all chip exports to Skyline.');
  if(f.sanctions==='none')m.push('Greenwood feels let down by your caution over sanctions.');
  if(f.chipAlt)m.push('A chip plant is being built with Greenwood\'s engineers.');
  if(f.aid)m.push('Greenwood\'s towns remember Skyline\'s food convoy.');
  if(f.retool)m.push('A retooled car plant makes components at home.');
  if(f.seaLoss)m.push(`${f.seaLoss} t of grain was lost at sea.`);
  return m;
}

const START=10000;

root.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.case!==undefined)return begin(+t.dataset.case);
  if("home" in t.dataset)return home();
  if("retry" in t.dataset)return begin(CASES.indexOf(C));
  if(t.dataset.open!==undefined&&st.points>0){st.open.add(+t.dataset.open);st.points--;return render()}
  if(t.dataset.q!==undefined){if(st.ans[+t.dataset.q]===undefined)st.ans[+t.dataset.q]=+t.dataset.o;return render()}
  if("back" in t.dataset){st.step=0;return render()}
  const step=st.step===2?1000:500;
  if(t.dataset.inc){st.alloc[t.dataset.inc]+=step;return render()}
  if(t.dataset.dec){st.alloc[t.dataset.dec]-=step;return render()}
  if(t.dataset.zero){st.alloc[t.dataset.zero]=0;return render()}
  if("next" in t.dataset){
    if(st.step===3){ // carry positions into the rebalance at current equity, same direction
      st.total=st.path[1];st.calls=[];
      C.assets.forEach(a=>{const prev=st.hist[0].alloc[a.id],e=st.eq[a.id]||0;
        if(prev===0)st.alloc[a.id]=0;
        else if(e<=0){st.alloc[a.id]=0;st.calls.push(a.name)}
        else st.alloc[a.id]=Math.sign(prev)*(C.frozen===a.id?e:Math.floor(e/500)*500);
      });
      if(st.total<=0)C.assets.forEach(a=>{st.alloc[a.id]=0});
    }
    st.step++;return render();
  }
  if("lock" in t.dataset){
    const sc=st.step===2?C.s1:C.s2;
    st.hist.push({alloc:{...st.alloc},cash:st.cash});
    C.assets.forEach(a=>{const x=st.alloc[a.id],r=sc.r[a.id];st.eq[a.id]=x>=0?x*(1+r):-x*(1-r)});
    st.path.push(Object.values(st.eq).reduce((a,b)=>a+b,0)+st.cash);
    st.step=st.step===2?3:5;return render();
  }
});

const GLOSSARY={
  "Backwardation":"When futures for later delivery are cheaper than the near contract. It signals tight supply now.",
  "Benchmark":"The yardstick you are judged against, such as an index you could have simply held.",
  "Capital controls":"Government limits on moving money or assets in or out of a country, for example a ban on foreigners selling shares.",
  "Clearing house":"The middleman that guarantees trades between brokers. It demands collateral (margin) to cover risk.",
  "Contango":"When futures for later delivery cost more than the near contract. Rolling a long position loses money (negative roll yield).",
  "Dash for cash":"A panic in which investors sell whatever they can, even safe assets, to raise cash or meet margin calls.",
  "Days to cover":"How many days of normal trading volume short sellers would need to buy back all borrowed shares.",
  "Delta":"How much an option's price moves for a 1-unit move in the share price (0 to 1 for calls).",
  "Dilution":"Issuing new shares, which shrinks existing shareholders' slice of the company.",
  "Discount rate":"The rate used to convert future cash flows into today's value. Higher rates mean lower present values.",
  "Doubling time":"How long a quantity growing at a constant rate takes to double.",
  "Duration (modified)":"Roughly the % change in a bond's price for a 1 percentage point change in its yield.",
  "Forward P/E":"Share price divided by expected earnings over the next 12 months.",
  "Free float":"Shares actually available to trade, excluding stakes held by insiders and long-term holders.",
  "Futures contract":"An agreement to buy or sell something at a set price on a future date.",
  "Gamma":"How fast an option's delta changes as the share price moves.",
  "Gamma squeeze":"Dealers who sold call options buy shares to hedge. Rising prices force them to buy more, which pushes prices higher still.",
  "Gross exposure":"The total size of all your positions, longs and shorts added together.",
  "Implied volatility (VIX)":"The volatility priced into options. A low VIX means markets expect calm.",
  "Inelastic demand":"Demand that barely changes when price changes, like bread or fuel. Small supply shocks cause big price moves.",
  "Liquidity":"How quickly you can sell something without moving its price much.",
  "Liquidity runway":"How long a company can survive on its cash before it needs new funding.",
  "Long-duration equity":"A stock whose value depends mostly on profits far in the future, such as a growth company. Very sensitive to interest rates.",
  "Long position":"Owning an asset, so you profit if its price rises.",
  "Margin call":"A demand to add cash when losses eat into your collateral. If you can't pay, your position is closed.",
  "Mark to market":"Valuing positions at today's price rather than the price you paid.",
  "Operating leverage":"High fixed costs mean profits swing much more than revenue does.",
  "R₀ (basic reproduction number)":"The average number of people one infected person infects. Above 1, an outbreak grows.",
  "Roll yield":"The gain or loss from replacing an expiring futures contract with the next one.",
  "Safe haven":"An asset expected to hold its value in a crisis, such as gold or government bonds.",
  "Sanctions":"Penalties on a country, such as asset freezes, trade bans or exclusion from payment networks.",
  "Securities lending":"Lending shares to short sellers for a fee. A high fee means few shares are left to borrow.",
  "Short interest":"The number of shares currently sold short.",
  "Short selling":"Borrowing shares and selling them, hoping to buy back cheaper. Gains are capped at 100%; losses are unlimited.",
  "Short squeeze":"A rising price forces short sellers to buy back, which pushes the price up further.",
  "T+2 settlement":"Trades are finalised two business days after they're made. Brokers post collateral to cover the gap.",
  "Value trap":"An asset that looks cheap on paper but stays cheap or falls, often because of a hidden risk.",
  "Yield curve inversion":"When short-term interest rates are above long-term ones. Historically, a recession warning."
};
