name: Update data and publish site

on:
  schedule:
    - cron: "*/30 14-21 * * 1-5"   # every 30 min while the US market is open (UTC)
    - cron: "0 23 * * *"           # nightly full refresh
  workflow_dispatch:                # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'SignalWatch-demo coyle9793@users.noreply.github.com' }}
          QUIVER_TOKEN: ${{ secrets.QUIVER_TOKEN }}
        run: python scripts/build_all.py
      - name: Save a copy of the data on the "data" branch (keeps a history of calls)
        run: |
          cd site/data
          git init -q -b data && git add -A
          git -c user.name="signal-watch-bot" -c user.email="actions@github.com" commit -qm "Data $(date -u +%F_%H%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
