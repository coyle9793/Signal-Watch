name: Update data and publish site

on:
  schedule:
    - cron: "*/30 14-21 * * 1-5"   # every 30 min while the US market is open (UTC)
    - cron: "0 23 * * *"           # nightly full refresh
  workflow_dispatch:                # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build data
        env:
          SEC_USER_AGENT: "SignalWatch demo (contact via GitHub repo)"
        run: python scripts/build_all.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
